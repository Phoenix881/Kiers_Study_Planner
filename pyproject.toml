[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hkbu-study-companion"
version = "0.5.0"
description = "A local study planner, GPA calculator, and degree progress checker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1.6,<4",
  "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "httpx2>=2.13,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/partials/*.html", "static/*", "static/icons/*", "curricula/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
